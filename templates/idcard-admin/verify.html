<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify ID Card – ID Studio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <style>
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .vbox { width: 100%; max-width: 440px; }
    .vbrand { text-align: center; font-weight: 700; font-size: 18px; margin-bottom: 16px; }
    .vbrand i { color: var(--primary); margin-right: 6px; }
    .vcard { border: 0; border-radius: 12px; overflow: hidden; box-shadow: 0 6px 24px rgba(15,23,42,.1); }
    .vtop { background: #f0fdf4; border-bottom: 1px solid #bbf7d0; text-align: center; padding: 22px 16px 18px; }
    .vtop .tick { width: 52px; height: 52px; border-radius: 50%; background: #16a34a; color: #fff; font-size: 28px; display: inline-grid; place-items: center; margin-bottom: 8px; }
    .vlist { list-style: none; margin: 0; padding: 8px 24px 18px; }
    .vlist li { display: flex; justify-content: space-between; gap: 16px; padding: 11px 0; border-bottom: 1px solid #edf1f6; }
    .vlist li:last-child { border-bottom: 0; }
    .vlist span { color: var(--muted); }
    .vlist strong { text-align: right; }
  </style>
</head>
<body>
  <div class="vbox">
    <div class="vbrand"><i class="bi bi-person-vcard-fill"></i>ID Studio · Card verification</div>
    <div class="card vcard">
      <div class="vtop">
        <span class="tick"><i class="bi bi-check-lg"></i></span>
        <h5 class="mb-1 text-success">Valid ID card</h5>
        <div class="text-muted small">This card is active and issued by Acme Corp</div>
      </div>
      <div class="card-body pb-0 pt-4 text-center">
        <div class="verify-photo"><i class="bi bi-person-fill"></i></div>
        <h5 class="mt-3 mb-0">John Carter</h5>
        <div class="text-muted">Software Engineer</div>
      </div>
      <ul class="vlist">
        <li><span>ID number</span><strong>EMP-10234</strong></li>
        <li><span>Organization</span><strong>Acme Corp</strong></li>
        <li><span>Department</span><strong>Engineering</strong></li>
        <li><span>Issued</span><strong>2025-12-31</strong></li>
        <li><span>Valid until</span><strong>2027-12-31</strong></li>
        <li><span>Status</span><strong><span class="badge-soft success" style="color:#16a34a">Active</span></strong></li>
      </ul>
    </div>
    <p class="text-center text-muted small mt-3 mb-0">Something looks wrong? <a href="#" class="text-primary text-decoration-none">Report this card</a></p>
  </div>
</body>
</html>
